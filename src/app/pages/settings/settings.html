<div class="p-6 space-y-6">
  <h1 class="text-2xl font-bold text-white">Paramètres et Sauvegarde</h1>
  
  <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
    <h2 class="text-lg font-medium text-white">Exporter les données</h2>
    <p class="text-sm text-slate-400">Télécharge une copie de sauvegarde de tous tes trades au format JSON.</p>
    <button 
      (click)="exportDatabase()"
      class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-500 transition-colors">
      Télécharger le fichier JSON
    </button>
  </div>
</div>
